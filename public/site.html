<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School</title>
<meta name="description" content="">
<link rel="icon" href="brand/aas-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#1d4ed8;--a:#f59e0b;--ink:#0f172a;--muted:#5b6478;--line:#e6e8f0;--bg:#f7f8fc;--r:18px;
  --p-50:color-mix(in srgb,var(--p) 7%,#fff);--p-100:color-mix(in srgb,var(--p) 14%,#fff);--p-700:color-mix(in srgb,var(--p) 75%,#000);--p-900:color-mix(in srgb,var(--p) 45%,#000)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#fff;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.c{width:min(1180px,100% - 40px);margin-inline:auto}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.85rem 1.4rem;border-radius:12px;font-weight:700;font-size:.98rem;border:2px solid transparent;cursor:pointer;transition:.2s;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn-a{background:var(--a);color:#1a1300;box-shadow:0 10px 24px color-mix(in srgb,var(--a) 35%,transparent)}
.btn-a:hover{transform:translateY(-2px)}
.btn-p{background:var(--p);color:#fff}
.btn-p:hover{background:var(--p-700)}
.btn-o{border-color:color-mix(in srgb,var(--p) 30%,#fff);color:var(--p)}
.btn-o:hover{background:var(--p-50)}
.btn-w{border-color:rgba(255,255,255,.5);color:#fff}
.btn-w:hover{background:rgba(255,255,255,.12)}
/* top strip + nav */
.strip{background:var(--p-900);color:#dbe2ff;font-size:.85rem}
.strip .c{display:flex;justify-content:space-between;gap:1rem;padding:.45rem 0}
.strip span{display:inline-flex;align-items:center;gap:.4rem;margin-right:1.2rem}
.strip svg{width:14px;height:14px;opacity:.85}
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .c{display:flex;align-items:center;gap:1.5rem;height:76px}
.logo{display:flex;align-items:center;gap:.75rem;min-width:0}
.logo .mark{width:48px;height:48px;border-radius:14px;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.05rem;flex:none;overflow:hidden}
.logo .mark img{width:100%;height:100%;object-fit:contain;background:#fff}
.logo b{display:block;font-size:1.08rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo small{color:var(--muted);font-weight:600;font-size:.8rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.links{display:flex;gap:1.3rem;margin-left:auto;font-weight:600;font-size:.95rem;color:#334;white-space:nowrap}
.links a:hover{color:var(--p)}
.links .mob{display:none}
.nav .acts{display:flex;gap:.6rem}
.nav .btn{padding:.6rem 1.05rem;font-size:.9rem}
.burger{display:none;margin-left:auto;background:none;border:0;width:44px;height:44px;border-radius:10px;cursor:pointer}
.burger svg{width:26px;height:26px}
/* hero */
.hero{position:relative;color:#fff;overflow:hidden;background:linear-gradient(135deg,var(--p-900),var(--p) 70%)}
.hero .bgimg{position:absolute;inset:0;background-size:cover;background-position:center}
.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--p-900) 92%,transparent) 0%,color-mix(in srgb,var(--p-900) 60%,transparent) 55%,transparent 100%)}
.hero .deco{position:absolute;border-radius:50%;filter:blur(2px)}
.hero .c{position:relative;padding:110px 0 150px;display:grid;grid-template-columns:1.15fr .85fr;gap:3rem;align-items:center}
.pill{display:inline-flex;align-items:center;gap:.5rem;padding:.4rem .9rem;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);font-weight:700;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--a)}
.hero h1{font-size:clamp(2.2rem,4.6vw,3.7rem);line-height:1.08;font-weight:800;letter-spacing:-.03em;margin:1.1rem 0}
.hero p{font-size:1.15rem;color:#e3e8ff;max-width:560px}
.hero .cta{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:2rem}
.hcard{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);border-radius:24px;padding:1.6rem}
.hcard h3{font-size:1.05rem;margin-bottom:1rem}
.hcard li{list-style:none;display:flex;gap:.8rem;padding:.75rem 0;border-top:1px solid rgba(255,255,255,.15);font-size:.95rem}
.hcard li:first-child{border-top:0}
.hcard .d{flex:none;width:52px;text-align:center;border-radius:12px;background:#fff;color:var(--p);font-weight:800;line-height:1.1;padding:.35rem 0}
.hcard .d small{display:block;font-size:.66rem;color:var(--muted);text-transform:uppercase}
/* stats */
.stats{position:relative;z-index:2;margin-top:-70px}
.stats .c{display:grid;grid-template-columns:repeat(var(--n,4),1fr);background:#fff;border-radius:22px;box-shadow:0 24px 60px rgba(15,23,42,.12);border:1px solid var(--line);overflow:hidden}
.stat{padding:1.7rem 1.5rem;text-align:center;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font-size:2.2rem;font-weight:800;color:var(--p);letter-spacing:-.02em}
.stat span{color:var(--muted);font-weight:600;font-size:.92rem}
/* sections */
section.s{padding:96px 0}
section.alt{background:var(--bg)}
.eyebrow{color:var(--p);font-weight:800;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase}
h2{font-size:clamp(1.8rem,3.2vw,2.6rem);line-height:1.15;letter-spacing:-.025em;margin:.5rem 0 1rem}
.lead{color:var(--muted);font-size:1.08rem;max-width:640px}
.head{text-align:center;margin-bottom:3rem}
.head .lead{margin-inline:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center}
.ph{border-radius:24px;overflow:hidden;aspect-ratio:4/3;background:linear-gradient(135deg,var(--p-100),var(--p-50));display:grid;place-items:center;position:relative;box-shadow:0 30px 60px rgba(15,23,42,.12)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .ini{font-size:5rem;font-weight:800;color:var(--p);opacity:.35}
.about .text p{color:#3b4357;margin-bottom:1rem;white-space:pre-line}
.ticks{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:1.4rem}
.ticks div{display:flex;gap:.55rem;font-weight:600;font-size:.95rem}
.ticks svg{width:20px;height:20px;color:var(--p);flex:none;margin-top:2px}
.msg{display:grid;grid-template-columns:300px 1fr;gap:3rem;align-items:center;background:#fff;border-radius:28px;padding:2.6rem;border:1px solid var(--line);box-shadow:0 20px 50px rgba(15,23,42,.06)}
.msg .ph{aspect-ratio:1/1.1}
.msg blockquote{font-size:1.2rem;line-height:1.7;color:#2a3146;position:relative;white-space:pre-line}
.msg blockquote:before{content:"\201C";position:absolute;left:-.2rem;top:-2.6rem;font-size:6rem;color:var(--p-100);font-family:Georgia,serif;line-height:1}
.msg .who{margin-top:1.4rem}
.msg .who b{display:block;font-size:1.1rem}
.msg .who span{color:var(--muted);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1.8rem;transition:.25s}
.card:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(15,23,42,.08);border-color:color-mix(in srgb,var(--p) 25%,#fff)}
.card .n{width:46px;height:46px;border-radius:12px;background:var(--p-50);color:var(--p);display:grid;place-items:center;font-weight:800;margin-bottom:1.1rem}
.card .ic{width:58px;height:58px;border-radius:16px;background:var(--p-50);display:grid;place-items:center;font-size:1.8rem;margin-bottom:1.1rem}
.card h3{font-size:1.15rem;margin-bottom:.45rem}
.card p{color:var(--muted);font-size:.96rem}
.gal{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:200px;gap:12px}
.gal a{border-radius:16px;overflow:hidden;position:relative;background:var(--p-50)}
.gal a.big{grid-column:span 2;grid-row:span 2}
.gal img{width:100%;height:100%;object-fit:cover;transition:.4s}
.gal a:hover img{transform:scale(1.06)}
.gal span{position:absolute;left:0;right:0;bottom:0;padding:1.2rem .9rem .7rem;color:#fff;font-weight:600;font-size:.88rem;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.news{display:grid;grid-template-columns:1.2fr .8fr;gap:2rem}
.box{background:#fff;border:1px solid var(--line);border-radius:22px;padding:1.6rem 1.8rem}
.box h3{font-size:1.15rem;margin-bottom:.6rem;display:flex;align-items:center;gap:.5rem}
.box h3 svg{width:22px;height:22px;color:var(--p)}
.ni{padding:1.1rem 0;border-top:1px solid var(--line)}
.ni:first-of-type{border-top:0}
.ni b{display:block;font-size:1.02rem}
.ni small{color:var(--p);font-weight:700;font-size:.8rem}
.ni p{color:var(--muted);font-size:.93rem;margin-top:.25rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev{display:flex;gap:1rem;padding:1rem 0;border-top:1px solid var(--line);align-items:center}
.ev:first-of-type{border-top:0}
.ev .d{flex:none;width:60px;border-radius:14px;background:var(--p);color:#fff;text-align:center;padding:.45rem 0;font-weight:800;font-size:1.35rem;line-height:1.1}
.ev .d small{display:block;font-size:.7rem;font-weight:700;opacity:.85;text-transform:uppercase}
.ev b{display:block}
.ev span{color:var(--muted);font-size:.88rem}
.tag{display:inline-block;padding:.1rem .55rem;border-radius:999px;background:var(--p-50);color:var(--p);font-size:.72rem;font-weight:700;text-transform:capitalize;margin-left:.3rem}
.empty{color:var(--muted);padding:1rem 0}
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,370px));justify-content:center;gap:1.4rem}
.q{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1.8rem}
.q .stars{color:var(--a);letter-spacing:2px;margin-bottom:.7rem}
.q p{color:#2f3750;white-space:pre-line}
.q .by{display:flex;align-items:center;gap:.7rem;margin-top:1.2rem}
.q .av{width:42px;height:42px;border-radius:50%;background:var(--p-100);color:var(--p);display:grid;place-items:center;font-weight:800}
.q .by span{display:block;color:var(--muted);font-size:.85rem}
.band{background:linear-gradient(120deg,var(--p-900),var(--p));color:#fff;border-radius:28px;padding:3.2rem;display:flex;align-items:center;justify-content:space-between;gap:2rem;position:relative;overflow:hidden}
.band:after{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;background:color-mix(in srgb,var(--a) 30%,transparent)}
.band>div{position:relative;z-index:1}
.band h2{margin:0 0 .4rem;color:#fff}
.band p{color:#dfe5ff;font-size:1.05rem}
.band .cta{display:flex;gap:.7rem;flex-wrap:wrap;position:relative;z-index:1}
.contact{display:grid;grid-template-columns:.9fr 1.1fr;gap:2rem}
.ci{display:flex;gap:1rem;padding:1.1rem 0;border-top:1px solid var(--line)}
.ci:first-of-type{border-top:0}
.ci .i{width:46px;height:46px;border-radius:12px;background:var(--p-50);color:var(--p);display:grid;place-items:center;flex:none}
.ci .i svg{width:22px;height:22px}
.ci b{display:block;font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ci a,.ci div>span{font-weight:600;font-size:1.02rem;white-space:pre-line}
.map{border-radius:22px;overflow:hidden;border:1px solid var(--line);min-height:380px;background:var(--p-50)}
.map iframe{width:100%;height:100%;min-height:380px;border:0}
footer{background:#0b1022;color:#aab2cc;padding:64px 0 28px;font-size:.95rem}
footer .c.g{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:2.5rem}
footer h4{color:#fff;margin-bottom:1rem;font-size:1rem}
footer li{list-style:none;margin:.45rem 0}
footer a:hover{color:#fff}
footer .logo b{color:#fff}
footer .soc{display:flex;gap:.6rem;margin-top:1.2rem}
footer .soc a{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.08);display:grid;place-items:center}
footer .soc svg{width:18px;height:18px}
footer .bot{border-top:1px solid rgba(255,255,255,.1);margin-top:2.5rem;padding-top:1.4rem;display:flex;justify-content:space-between;gap:1rem;font-size:.85rem;flex-wrap:wrap}
.wa{position:fixed;right:22px;bottom:22px;z-index:60;width:60px;height:60px;border-radius:50%;background:#22c55e;display:grid;place-items:center;box-shadow:0 14px 30px rgba(34,197,94,.45)}
.wa svg{width:32px;height:32px;fill:#fff}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;display:none;align-items:center;justify-content:center;padding:2rem;cursor:zoom-out}
.lb img{max-height:90vh;border-radius:12px}
.state{min-height:100vh;display:grid;place-items:center;text-align:center;padding:2rem;background:var(--bg)}
.state h1{font-size:1.8rem;margin:1rem 0 .4rem}
.state p{color:var(--muted)}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.reveal.in{opacity:1;transform:none}
@media (max-width:1180px){
  .links,.nav .acts{display:none}
  .burger{display:grid;place-items:center}
  .nav.open .links{display:flex;flex-direction:column;position:absolute;left:0;right:0;top:76px;background:#fff;padding:1rem 20px 1.4rem;border-bottom:1px solid var(--line);gap:.9rem}
  .nav.open .links .mob{display:block}
}
@media (max-width:980px){
  .hero .c{grid-template-columns:1fr;padding:80px 0 130px}
  .hcard{display:none}
  .stats .c{grid-template-columns:1fr 1fr}
  .stat:nth-child(3){border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .two,.news,.contact,.msg{grid-template-columns:1fr;gap:2rem}
  .msg{padding:1.6rem}
  .msg .ph{max-width:220px;aspect-ratio:1/1}
  .cards,.quotes{grid-template-columns:1fr 1fr}
  .gal{grid-template-columns:1fr 1fr;grid-auto-rows:150px}
  .band{flex-direction:column;align-items:flex-start;padding:2.2rem}
  footer .c.g{grid-template-columns:1fr}
  .strip .r{display:none}
}
@media (max-width:620px){
  .cards,.quotes{grid-template-columns:1fr}
  .strip{display:none}
  section.s{padding:72px 0}
  .ticks{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"><div class="state"><div><p>Loading…</p></div></div></div>
<div class="lb" id="lb"><img alt=""></div>
<script>
(function () {
  const base = location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, '');
  const q = new URLSearchParams(location.search);
  const school = q.get('school');
  const api = base + 'api/public/site' + (school ? '?school=' + encodeURIComponent(school) : '');
  const portal = base + 'portal/index.html';
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const initials = (n) => String(n || '').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase() || 'S';
  const I = {
    phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
    mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
    pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
    cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    arrow: '<path d="M5 12h14M12 5l7 7-7 7"/>',
    user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    menu: '<path d="M3 6h18M3 12h18M3 18h18"/>',
    fb: '<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>',
    ig: '<rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/>',
    yt: '<path d="M22.5 6.4a2.8 2.8 0 0 0-2-2C18.9 4 12 4 12 4s-6.9 0-8.5.4a2.8 2.8 0 0 0-2 2A29 29 0 0 0 1 12a29 29 0 0 0 .5 5.6 2.8 2.8 0 0 0 2 2c1.6.4 8.5.4 8.5.4s6.9 0 8.5-.4a2.8 2.8 0 0 0 2-2A29 29 0 0 0 23 12a29 29 0 0 0-.5-5.6z"/><path d="m9.8 15.5 5.7-3.5-5.7-3.5z"/>',
  };
  const ic = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
  const WA = '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.6 14.1c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1a17 17 0 0 1-1.7-.6 13.4 13.4 0 0 1-5.1-4.5c-.4-.5-1-1.5-1-2.6 0-1.1.6-1.6.8-1.9.2-.2.4-.3.6-.3h.4c.1 0 .3 0 .5.4l.7 1.7c.1.2.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.5.2.3.7 1.2 1.5 1.9 1 .9 1.9 1.2 2.1 1.3.3.1.4.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.7.8c.3.1.4.2.5.3.1.1.1.6-.1 1.3z"/></svg>';
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const d = (s) => { const x = new Date(String(s).slice(0, 10) + 'T00:00:00'); return isNaN(x) ? null : x; };
  const fdate = (s) => { const x = d(s); return x ? `${x.getDate()} ${MON[x.getMonth()]} ${x.getFullYear()}` : ''; };
  const digits = (p) => String(p || '').replace(/\D+/g, '').replace(/^0/, '92');
  const mapSrc = (map, address) => {
    const m = String(map || '').match(/src="([^"]+)"/); const url = m ? m[1] : String(map || '').trim();
    if (/^https:\/\/(www\.)?google\.[a-z.]+\/maps\//.test(url)) return url;
    return address ? 'https://www.google.com/maps?q=' + encodeURIComponent(address) + '&output=embed' : '';
  };

  fetch(api, { headers: { Accept: 'application/json' } }).then(async (r) => {
    const data = await r.json().catch(() => ({}));
    if (!r.ok) return state(data.school?.name || 'School website', data.message || 'This website is not available.');
    render(data);
  }).catch(() => state('School website', 'Could not load the website. Please try again.'));

  function state(title, msg) {
    document.title = title;
    document.getElementById('app').innerHTML = `<div class="state"><div><img src="brand/aas-logo.svg" style="width:64px;margin:0 auto;border-radius:16px" alt=""><h1>${esc(title)}</h1><p>${esc(msg)}</p></div></div>`;
  }

  function render({ school, website: w, notices, events, admission_open }) {
    const on = (k) => w.sections?.[k] !== false;
    const name = school.name;
    const sub = [school.campus_name, school.city].filter(Boolean).join(' · ');
    const c = w.contact || {};
    const wa = digits(c.whatsapp || c.phone);
    const root = document.documentElement.style;
    root.setProperty('--p', w.theme?.primary || '#1d4ed8');
    root.setProperty('--a', w.theme?.accent || '#f59e0b');
    document.title = name + (school.campus_name ? ' – ' + school.campus_name : '');
    document.querySelector('meta[name=description]').content = w.hero?.subtitle || '';
    if (school.logo_url) document.querySelector('link[rel=icon]').href = school.logo_url;

    const mark = school.logo_url ? `<img src="${esc(school.logo_url)}" alt="">` : esc(initials(name));
    const logo = `<a class="logo" href="#top"><div class="mark">${mark}</div><div><b>${esc(name)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div></a>`;
    const apply = admission_open && on('admission') ? `<a class="btn btn-a" href="${portal}#/apply">${esc(w.hero?.button || 'Apply for admission')} ${ic('arrow')}</a>` : '';
    const navLinks = [['about', 'About'], ['programs', 'Programs'], ['facilities', 'Facilities'], ['gallery', 'Gallery'], ['news', 'News & events'], ['contact', 'Contact']]
      .filter(([k]) => k === 'news' ? (on('notices') || on('events')) : on(k) && (k !== 'gallery' || (w.gallery || []).length))
      .map(([k, l]) => `<a href="#${k}">${l}</a>`).join('');
    const upcoming = (events || []).slice(0, 3);
    const social = [['facebook', 'fb'], ['instagram', 'ig'], ['youtube', 'yt']].filter(([k]) => w.social?.[k]).map(([k, i]) => `<a href="${esc(w.social[k])}" target="_blank" rel="noopener" aria-label="${k}">${ic(i)}</a>`).join('');

    let h = '';
    h += `<div class="strip"><div class="c"><div>${c.phone ? `<span>${ic('phone')}${esc(c.phone)}</span>` : ''}${c.email ? `<span>${ic('mail')}${esc(c.email)}</span>` : ''}</div><div class="r">${c.timings ? `<span>${ic('clock')}${esc(c.timings)}</span>` : ''}</div></div></div>`;
    h += `<header class="nav" id="nav"><div class="c">${logo}<nav class="links">${navLinks}<a class="mob" href="${portal}">Parent / teacher login</a>${admission_open && on('admission') ? `<a class="mob" href="${portal}#/apply" style="color:var(--p)">Apply for admission →</a>` : ''}</nav><div class="acts"><a class="btn btn-o" href="${portal}">${ic('user')} Parent login</a>${apply}</div><button class="burger" aria-label="Menu" onclick="document.getElementById('nav').classList.toggle('open')">${ic('menu')}</button></div></header>`;

    // Hero
    h += `<section class="hero" id="top">${w.hero?.image_url ? `<div class="bgimg" style="background-image:url('${esc(w.hero.image_url)}')"></div><div class="shade"></div>` : `<div class="deco" style="width:520px;height:520px;right:-120px;top:-160px;background:color-mix(in srgb,var(--a) 22%,transparent)"></div><div class="deco" style="width:380px;height:380px;left:-140px;bottom:-180px;background:rgba(255,255,255,.07)"></div>`}
      <div class="c"><div><span class="pill"><i></i>${admission_open ? 'Admissions open' : esc(school.city || 'Welcome')}</span>
        <h1>${esc(w.hero?.title)}</h1><p>${esc(w.hero?.subtitle)}</p>
        <div class="cta">${apply}<a class="btn btn-w" href="#contact">${ic('phone')} Contact us</a></div></div>
        ${upcoming.length ? `<div class="hcard"><h3>Coming up at school</h3><ul>${upcoming.map((e) => { const x = d(e.start_date); return `<li><div class="d">${x ? x.getDate() : ''}<small>${x ? MON[x.getMonth()] : ''}</small></div><div><b>${esc(e.title)}</b><br><small style="opacity:.8">${esc(e.location || e.type)}</small></div></li>`; }).join('')}</ul></div>` : ''}
      </div></section>`;

    if (on('stats') && (w.stats || []).length) {
      h += `<div class="stats"><div class="c" style="--n:${Math.min(4, w.stats.length)}">${w.stats.slice(0, 4).map((s) => `<div class="stat"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join('')}</div></div>`;
    }

    if (on('about')) {
      h += `<section class="s about" id="about"><div class="c two"><div class="text reveal"><div class="eyebrow">About us</div><h2>${esc(w.about?.title)}</h2>${String(w.about?.text || '').split(/\n{2,}/).map((p) => `<p>${esc(p)}</p>`).join('')}
        <div class="ticks">${['Qualified, caring teachers', 'Safe & disciplined campus', 'Regular parent meetings', 'Online parent portal'].map((t) => `<div>${ic('check')}${t}</div>`).join('')}</div></div>
        <div class="ph reveal">${w.about?.image_url ? `<img src="${esc(w.about.image_url)}" alt="">` : `<div class="ini">${esc(initials(name))}</div>`}</div></div></section>`;
    }

    if (on('principal') && w.principal?.message) {
      h += `<section class="s alt"><div class="c"><div class="msg reveal"><div class="ph">${w.principal.photo_url ? `<img src="${esc(w.principal.photo_url)}" alt="">` : `<div class="ini">${esc(initials(w.principal.name || w.principal.designation))}</div>`}</div>
        <div><div class="eyebrow">Message from the ${esc((w.principal.designation || 'principal').toLowerCase())}</div><h2 style="margin-bottom:2.4rem">A word from our leadership</h2><blockquote>${esc(w.principal.message)}</blockquote>
        <div class="who">${w.principal.name ? `<b>${esc(w.principal.name)}</b>` : ''}<span>${esc(w.principal.designation)}, ${esc(name)}</span></div></div></div></div></section>`;
    }

    if (on('programs') && (w.programs || []).length) {
      h += `<section class="s" id="programs"><div class="c"><div class="head reveal"><div class="eyebrow">Academics</div><h2>Our programs</h2><p class="lead">A complete learning journey for every stage of your child's education.</p></div>
        <div class="cards">${w.programs.map((p, i) => `<div class="card reveal"><div class="n">${String(i + 1).padStart(2, '0')}</div><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p></div>`).join('')}</div></div></section>`;
    }

    if (on('facilities') && (w.facilities || []).length) {
      h += `<section class="s alt" id="facilities"><div class="c"><div class="head reveal"><div class="eyebrow">Campus life</div><h2>Facilities</h2><p class="lead">Everything your child needs to learn, play and grow.</p></div>
        <div class="cards">${w.facilities.map((f) => `<div class="card reveal"><div class="ic">${esc(f.icon || '⭐')}</div><h3>${esc(f.title)}</h3><p>${esc(f.text)}</p></div>`).join('')}</div></div></section>`;
    }

    if (on('gallery') && (w.gallery || []).length) {
      h += `<section class="s" id="gallery"><div class="c"><div class="head reveal"><div class="eyebrow">Gallery</div><h2>Life at ${esc(name)}</h2></div>
        <div class="gal">${w.gallery.map((g, i) => `<a href="${esc(g.url)}" data-lb class="reveal${i === 0 && w.gallery.length % 4 === 1 ? ' big' : ''}"><img src="${esc(g.url)}" alt="${esc(g.caption)}" loading="lazy">${g.caption ? `<span>${esc(g.caption)}</span>` : ''}</a>`).join('')}</div></div></section>`;
    }

    if (on('notices') || on('events')) {
      h += `<section class="s alt" id="news"><div class="c"><div class="head reveal"><div class="eyebrow">Stay updated</div><h2>News & events</h2></div><div class="news" style="${on('notices') && on('events') ? '' : 'grid-template-columns:1fr'}">
        ${on('notices') ? `<div class="box reveal"><h3>${ic('bell')} Latest notices</h3>${(notices || []).map((n) => `<div class="ni"><small>${fdate(n.publish_date)}</small><b>${esc(n.title)}</b><p>${esc(n.body)}</p></div>`).join('') || '<p class="empty">No notices at the moment.</p>'}</div>` : ''}
        ${on('events') ? `<div class="box reveal"><h3>${ic('cal')} Upcoming events</h3>${(events || []).map((e) => { const x = d(e.start_date); return `<div class="ev"><div class="d">${x ? x.getDate() : ''}<small>${x ? MON[x.getMonth()] : ''}</small></div><div><b>${esc(e.title)}<span class="tag">${esc(e.type)}</span></b><span>${esc([e.end_date && e.end_date !== e.start_date ? 'till ' + fdate(e.end_date) : '', e.start_time ? String(e.start_time).slice(0, 5) : '', e.location].filter(Boolean).join(' · '))}</span></div></div>`; }).join('') || '<p class="empty">No upcoming events.</p>'}</div>` : ''}
      </div></div></section>`;
    }

    if (on('testimonials') && (w.testimonials || []).length) {
      h += `<section class="s"><div class="c"><div class="head reveal"><div class="eyebrow">Parents say</div><h2>What families tell us</h2></div>
        <div class="quotes">${w.testimonials.map((t) => `<div class="q reveal"><div class="stars">★★★★★</div><p>${esc(t.text)}</p><div class="by"><div class="av">${esc(initials(t.name))}</div><div><b>${esc(t.name)}</b><span>${esc(t.role)}</span></div></div></div>`).join('')}</div></div></section>`;
    }

    if (on('admission') && admission_open) {
      h += `<section class="s" style="padding-top:${on('testimonials') && (w.testimonials || []).length ? 0 : 96}px"><div class="c"><div class="band reveal"><div><h2>Admissions are open</h2><p>Apply online in a few minutes — our office will contact you for the next steps.</p></div>
        <div class="cta"><a class="btn btn-a" href="${portal}#/apply">Apply online ${ic('arrow')}</a>${c.phone ? `<a class="btn btn-w" href="tel:${esc(c.phone)}">${ic('phone')} ${esc(c.phone)}</a>` : ''}</div></div></div></section>`;
    }

    if (on('contact')) {
      const src = mapSrc(c.map, c.address);
      h += `<section class="s alt" id="contact"><div class="c"><div class="head reveal"><div class="eyebrow">Contact</div><h2>Visit or get in touch</h2></div><div class="contact" style="${src ? '' : 'grid-template-columns:1fr;max-width:640px;margin-inline:auto'}">
        <div class="box reveal">${c.address ? `<div class="ci"><div class="i">${ic('pin')}</div><div><b>Address</b><span>${esc(c.address)}</span></div></div>` : ''}
          ${c.phone ? `<div class="ci"><div class="i">${ic('phone')}</div><div><b>Phone</b><a href="tel:${esc(c.phone)}">${esc(c.phone)}</a></div></div>` : ''}
          ${wa ? `<div class="ci"><div class="i" style="color:#16a34a;background:#dcfce7">${WA.replace('<svg', '<svg width="22" height="22" fill="currentColor"')}</div><div><b>WhatsApp</b><a href="https://wa.me/${wa}" target="_blank" rel="noopener">${esc(c.whatsapp || c.phone)}</a></div></div>` : ''}
          ${c.email ? `<div class="ci"><div class="i">${ic('mail')}</div><div><b>Email</b><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></div></div>` : ''}
          ${c.timings ? `<div class="ci"><div class="i">${ic('clock')}</div><div><b>Office timings</b><span>${esc(c.timings)}</span></div></div>` : ''}</div>
        ${src ? `<div class="map reveal"><iframe src="${esc(src)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Map"></iframe></div>` : ''}</div></div></section>`;
    }

    h += `<footer><div class="c g"><div>${logo}<p style="margin-top:1rem;max-width:380px">${esc(w.hero?.subtitle)}</p>${social ? `<div class="soc">${social}</div>` : ''}</div>
      <div><h4>Quick links</h4><ul>${navLinks.split('</a>').filter(Boolean).map((a) => `<li>${a}</a></li>`).join('')}</ul></div>
      <div><h4>Portals</h4><ul><li><a href="${portal}">Parent & student login</a></li><li><a href="${portal}">Teacher login</a></li>${admission_open ? `<li><a href="${portal}#/apply">Online admission</a></li><li><a href="${portal}#/apply">Check application status</a></li>` : ''}</ul></div></div>
      <div class="c bot"><span>© ${new Date().getFullYear()} ${esc(name)}. All rights reserved.</span><span>Powered by <a href="https://wa.me/923009712726" target="_blank" rel="noopener" style="color:#fbbf24;font-weight:700">AAS School Manager</a></span></div></footer>`;
    if (wa) h += `<a class="wa" href="https://wa.me/${wa}" target="_blank" rel="noopener" aria-label="WhatsApp">${WA}</a>`;

    document.getElementById('app').innerHTML = h;

    // Gallery lightbox
    const lb = document.getElementById('lb');
    document.querySelectorAll('[data-lb]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); lb.querySelector('img').src = a.href; lb.style.display = 'flex'; }));
    lb.onclick = () => (lb.style.display = 'none');
    document.querySelectorAll('.links a').forEach((a) => a.addEventListener('click', () => document.getElementById('nav').classList.remove('open')));
    // Reveal on scroll
    const io = 'IntersectionObserver' in window ? new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12 }) : null;
    document.querySelectorAll('.reveal').forEach((el) => (io ? io.observe(el) : el.classList.add('in')));
  }
})();
</script>
</body>
</html>
